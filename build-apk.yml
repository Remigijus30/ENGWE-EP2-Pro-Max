name: Pagaminti ENGWE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'engwe-ep2-pro-max-android-project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Paimti failus
        uses: actions/checkout@v4

      - name: Idiegti Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Idiegti Android SDK
        uses: android-actions/setup-android@v3

      - name: Idiegti Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Idiegti Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Isskleisti Android projekta
        run: |
          mkdir -p android-project
          unzip -q engwe-ep2-pro-max-android-project.zip -d android-project

      - name: Pagaminti APK
        working-directory: android-project
        run: gradle --no-daemon assembleRelease

      - name: Pateikti APK atsisiuntimui
        uses: actions/upload-artifact@v4
        with:
          name: ENGWE-EP2-Pro-Max-APK
          path: android-project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
